# VPN Robot — Nginx reverse proxy (certbot rewrites this for TLS on :443).
# Dashboard at /, API under /api and /docs. Replace example.com before use.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream vpnrobot_api {
    server 127.0.0.1:8000;
}
upstream vpnrobot_dashboard {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name example.com;

    client_max_body_size 12m;   # receipt/broadcast uploads

    # Security headers (HSTS added once TLS is live)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # API + OpenAPI docs + payment callback
    location ~ ^/(api|docs|redoc|openapi.json) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://vpnrobot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js dashboard (everything else)
    location / {
        proxy_pass http://vpnrobot_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
